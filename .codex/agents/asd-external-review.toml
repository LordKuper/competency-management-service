 "required": [".asd/project/config.yaml (review.external_review, system.tools.claude_command)", "payload.manifest: external.scope.json (external-review/t_review-scope.json), written to the review output dir by emit-manifest; fields and iteration semantics per external-review.md 'Phase-scoped payload' and 'Iteration semantics'", "payload.diff", "payload.iteration", "payload.floor", "payload: phase, wave (impl-review), review output dir, the preflight result (its platform included)", "prompt-slot context, paths only: language.docs, custom-common-rules and the phase-scoped custom rules"],
