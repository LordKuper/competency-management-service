## Escalation

```json
[{"when": "phase-supplied preflight non-ready: resolved system.tools.claude_command override or claude binary unavailable, auth failure, active negative cache", "signal": "APPROVE (skipped: external review unavailable: <specific status>)", "note": "no prompt; the phase orchestrator logs the reason to decisions-log and creates no latch"},
