apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: competency
spec:
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-keys
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: competency
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: competency
spec:
  replicas: 1
  # One pod at a time: the key volume is ReadWriteOnce and the app applies schema migrations at start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/part-of: competency
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        # Makes the key volume writable for uid 1654.
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: competency-app:<VERSION>@sha256:<DIGEST>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: competency-secret
                  key: ConnectionStrings__Default
            # Read only while no active administrator exists; optional so the keys can be dropped from the Secret later.
            - name: Bootstrap__AdminEmail
              valueFrom:
                secretKeyRef:
                  name: competency-secret
                  key: Bootstrap__AdminEmail
                  optional: true
            - name: Bootstrap__AdminPassword
              valueFrom:
                secretKeyRef:
                  name: competency-secret
                  key: Bootstrap__AdminPassword
                  optional: true
            # Only for a relay that requires authentication; set both keys or neither.
            - name: Smtp__UserName
              valueFrom:
                secretKeyRef:
                  name: competency-secret
                  key: Smtp__UserName
                  optional: true
            - name: Smtp__Password
              valueFrom:
                secretKeyRef:
                  name: competency-secret
                  key: Smtp__Password
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # The port opens only after the schema is migrated, so the startup probe covers migrations.
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: keys
              mountPath: /var/lib/competency/keys
      volumes:
        - name: keys
          persistentVolumeClaim:
            claimName: app-keys
