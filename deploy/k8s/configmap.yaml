apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: competency
data:
  # Must equal the mountPath of the app-keys volume in app.yaml.
  DataProtection__KeysPath: /var/lib/competency/keys
  # Where TLS ends is not decided yet. Switch to Always once it ends in front of the app,
  # otherwise the session cookie is issued without the Secure flag.
  Authentication__Cookie__SecurePolicy: SameAsRequest
  # Files in the image never change at runtime, and every config watcher spends one instance
  # of the node-wide inotify limit.
  DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: competency
data:
  # Must match Database and Username in ConnectionStrings__Default of the Secret.
  POSTGRES_USER: competency
  POSTGRES_DB: competency
