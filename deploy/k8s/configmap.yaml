apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: competency
data:
  # Must equal the mountPath of the app-keys volume in app.yaml.
  DataProtection__KeysPath: /var/lib/competency/keys
  # Where TLS ends is not decided yet. Switch to Always once it ends in front of the app,
  # otherwise the session cookie is issued without the Secure flag.
  Authentication__Cookie__SecurePolicy: SameAsRequest
  # Files in the image never change at runtime, and every config watcher spends one instance
  # of the node-wide inotify limit.
  DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
  # Address users open the application at; every link in an e-mail starts with it. The app does not start without
  # an absolute http(s) URL here.
  App__PublicBaseUrl: "<PUBLIC_BASE_URL>"
  # Corporate SMTP relay. Credentials, when the relay needs them, go to the Secret (Smtp__UserName, Smtp__Password).
  Smtp__Host: "<SMTP_HOST>"
  Smtp__Port: "587"
  # None, Auto, SslOnConnect (port 465), StartTls (port 587) or StartTlsWhenAvailable. None sends mail unencrypted.
  Smtp__SecureSocketOptions: StartTls
  # Sender mailbox, optionally "Name <address>".
  Smtp__From: "<SMTP_FROM>"
  # Upper bound for one send; an administrator's request waits for it.
  Smtp__Timeout: "00:00:15"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: competency
data:
  # Must match Database and Username in ConnectionStrings__Default of the Secret.
  POSTGRES_USER: competency
  POSTGRES_DB: competency
