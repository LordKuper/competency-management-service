user_gates: adaptive # adaptive | strict; hard gates always require user approval

# ASD workflow configuration.
# Generated by /asd-init. Edit only via /asd-init (diff mode).

# ASD developing itself through its own workflow. Absent field = disabled.
# Values: enabled | disabled. See .asd/rules/sprint-lifecycle.md "Self-hosting".
self_hosting: disabled

# Optional sprint documents and their persistent docs counterpart.
# Defaults: see .asd/rules/sprint-lifecycle.md "Optional documents".
documents:
  audit: auto          # auto | always | off
  prd: enabled         # enabled | disabled; design/prd.html + persistent requirements
  ux_spec: enabled     # enabled | disabled; ux-spec, design-system gate, design-md-delta
  adr: enabled          # enabled | disabled; adr.html (sprint-scoped only; folds into existing persistent docs at design-promote)

# Language for user-facing interaction.
# chat — language used in chat responses and questions.
# docs — language used in user-facing artifacts (PRD, ADR, UX-spec, plan, reviews, sprint.md).
# Machine-readable files (state.json, config.yaml, settings.json) are always English caveman-style.
# Values: ru | en
language:
  chat: ru
  docs: ru

# Backward compatibility policy for changes made by the workflow.
# strict    — public API/contracts never break.
# migration — breaking changes allowed with a documented migration path and deprecation notice.
# none      — free hand, breaking changes allowed without ceremony.
# Values: strict | migration | none
backward_compat: migration

review:
  # External review via the other provider's CLI (Codex CLI wrapped in a Claude
  # session, Claude CLI wrapped in a Codex session), performed in parallel with
  # internal reviewers. Values: enabled | disabled
  external_review: enabled

  # Maximum number of review iterations per severity level.
  # On iteration N, only issues of severity X or higher are considered.
  # Defaults below mean: trivial issues get one shot, critical issues loop up to ten times.
  iterations_low: 1
  iterations_medium: 1
  iterations_high: 2
  iterations_critical: 10

project:
  # Subsystem decomposition. When enabled, persistent docs are organized per subsystem,
  # registered in docs/architecture/subsystems.md. When disabled, single project-wide docs.
  # Values: enabled | disabled
  subsystem_decomposition: enabled

  # Diagram tool for architecture views. Any diagram also requires subsystem_decomposition: enabled.
  # none — no diagram written; the subsystem registry is unaffected
  # likec4 — text DSL in docs/architecture/c4/model/*.c4 + likec4 CLI builds dist/
  # mermaid — Mermaid block inline in docs/architecture/subsystems.md; no c4/ folder
  # Values: none | likec4 | mermaid
  diagram_tool: mermaid

system:
  tools:
    # Codex CLI command path. Empty for default lookup (`codex` on all OSes).
    # Override for external review when running under Claude Code (wraps Codex); init/runtime probe this resolved command.
    codex_command: ""

    # Claude CLI command path. Empty for default lookup (`claude` on all OSes).
    # Override for external review when running under Codex (wraps Claude CLI); init/runtime probe this resolved command.
    claude_command: ""

git:
  # Base branch for new sprint branches and PR target.
  base_branch: main

  # Sprint branch name pattern.
  # {n}    — sprint number, zero-padded to 3 digits (e.g. 001).
  # {slug} — kebab-case slug derived from sprint scope.
  branch_pattern: "sprint/{n}-{slug}"
